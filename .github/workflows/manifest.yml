# The Manifest kept in plugin/ is what the program prints: built natively and asked, at every change.
name: manifest

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the Manifest kept is the Manifest printed
        working-directory: plugin
        run: |
          cargo build --release
          target/release/notifications --manifest | diff -u com.yoke.notifications.yaml -
      # The server is tried on a bus of the test's own.
      - run: sudo apt-get update -q && sudo apt-get install -y -q dbus
      - name: the tests
        working-directory: plugin
        run: cargo test
