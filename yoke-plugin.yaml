plugin: 1
id: com.yoke.notifications
language: rust
program: notifications
manifest: plugin/com.yoke.notifications.yaml
build:
  in: plugin/
  run: cargo build --release --target "$YOKE_RUST_TARGET" && cp "target/$YOKE_RUST_TARGET/release/notifications" "$YOKE_OUT/notifications"
architectures: [x86_64, aarch64]
